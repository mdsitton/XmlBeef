FileVersion = 1

# The [XmlObject] generator's build-time checks (test-codegen.sh): each fixture in src/Fixtures.bf is
# built alone (-define=FIXTURE_<name>) and must stop the build with its message, or build when it is a
# positive control.
[Workspace]
StartupProject = "Fixtures"

[Projects]
XmlBeef = {Path = "../.."}
Fixtures = {Path = "."}
FormatCore = {Path = "../../../FormatCore-xml"}
