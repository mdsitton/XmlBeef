# bench/instructions.sh's description of XmlTester (FormatCore's bench-kit; sourced by bash).
# Usage: bash bench/instructions.sh [input names...]   (beefbuild -config=Release first)
# The stream columns read the inputs as a Stream through the default 64 KiB buffer and a 4 KiB one.
TESTER=./build/Release_Linux64/XmlTester/XmlTester
INPUT_DIR=bench/compare/inputs
EXTENSIONS=(xml)
INPUTS=(svg-icons svg-artwork svg-generated records book osm atom book-utf16)
MODES=(events document stream "stream4k:stream buffer=4096")
BUILD_HINT="beefbuild -config=Release"
